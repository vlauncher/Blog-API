name: CI / Production Quality & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build & Test (Node.js 22)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Synchronize Database Schema
        run: npx prisma db push

      - name: TypeScript Build Validation
        run: npm run build

      - name: Run Test Suite with Coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          PORT: 8000
          DATABASE_URL: "file:./test.db"
          REDIS_URL: "redis://localhost:6379"
          JWT_ACCESS_SECRET: "test_access_super_secret_key_1234567890"
          JWT_REFRESH_SECRET: "test_refresh_super_secret_key_1234567890"
          SITE_URL: "http://localhost:8000"

  docker-build:
    name: Validate Alpine Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: blog-api:latest
